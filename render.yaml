services:
  # ── API Server (embedded worker + SQLite) — FREE ──────────────────────────
  - type: web
    name: dispatch-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./dispatch.db
      - key: REDIS_URL
        fromService:
          name: dispatch-redis
          type: redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ── Dashboard (static site) — FREE ───────────────────────────────────────
  - type: web
    name: dispatch-dashboard
    runtime: static
    plan: free
    staticPublishPath: frontend
    buildCommand: echo "no build needed"

  # ── Redis — FREE ──────────────────────────────────────────────────────────
  - type: redis
    name: dispatch-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
