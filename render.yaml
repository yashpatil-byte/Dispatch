services:
  # ── API Server ────────────────────────────────────────────────────────────
  - type: web
    name: dispatch-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dispatch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dispatch-redis
          type: redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ── Worker ────────────────────────────────────────────────────────────────
  - type: worker
    name: dispatch-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dispatch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dispatch-redis
          type: redis
          property: connectionString
      - key: API_URL
        fromService:
          name: dispatch-api
          type: web
          property: host
      - key: CONCURRENCY
        value: "2"
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ── Dashboard (static site) ───────────────────────────────────────────────
  - type: web
    name: dispatch-dashboard
    runtime: static
    staticPublishPath: frontend
    buildCommand: echo "no build needed"

  # ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: dispatch-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  - name: dispatch-db
    plan: free
