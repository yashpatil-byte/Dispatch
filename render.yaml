services:
  # ── API Server (includes embedded worker for free-tier hosting) ───────────
  - type: web
    name: dispatch-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dispatch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dispatch-redis
          type: redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ── Dashboard (static site — free) ───────────────────────────────────────
  - type: web
    name: dispatch-dashboard
    runtime: static
    staticPublishPath: frontend
    buildCommand: echo "no build needed"

  # ── Redis (free) ──────────────────────────────────────────────────────────
  - type: redis
    name: dispatch-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # ── PostgreSQL (free) ─────────────────────────────────────────────────────
  - name: dispatch-db
    plan: free
